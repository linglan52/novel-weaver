[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-weaver"
version = "0.1.0"
description = "面向长篇网文写作者的结构管理与 AI 一致性助手：人物关系图谱、卷章大纲、主线/情感配比追踪、设定库、伏笔管理。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhang Gulei" }]
keywords = ["novel", "writing", "fiction", "worldbuilding", "outline", "小说", "写作"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.30.0"]
graph = ["networkx>=3.0", "plotly>=5.0"]
ai = ["httpx>=0.27.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
novel-weaver = "novel_weaver.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
